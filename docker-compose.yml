networks:
  gym_network:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
  grafana_data:
  loki_data:

services:
  db:
    image: mysql:8.0
    container_name: gym_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: gym_db
      MYSQL_USER: gym_user
      MYSQL_PASSWORD: gym_password_123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - gym_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: gym_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - gym_network

  postgres:
    image: postgres:15-alpine
    container_name: gym_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_123
      POSTGRES_DB: gym_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gym_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gym_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_123
    depends_on:
      - postgres
    networks:
      - gym_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym_backend
    restart: always
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: gym_user
      DB_PASSWORD: gym_password_123
      DB_NAME: gym_db
    depends_on:
      - db
    networks:
      - gym_network

  nginx:
    image: nginx:alpine
    container_name: gym_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - phpmyadmin
    networks:
      - gym_network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: gym_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - gym_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: gym_cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - gym_network

  loki:
    image: grafana/loki:3.0.0
    container_name: gym_loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - gym_network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: gym_promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - gym_network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: gym_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_strong_password
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - gym_network
